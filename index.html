  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>flyfishPhilo</title>
  <style>:root {
  color-scheme: light;
  --paper: #f7f5ee;
  --sheet: #fffdf7;
  --ink: #242923;
  --muted: #565e55;
  --rule: #cbcfc1;
  --edge: #798373;
  --green: #205d51;
  --green-dark: #154238;

  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 1rem/1.65 var(--sans); overflow-wrap: anywhere; }
button, input, textarea, select { color: inherit; font: inherit; }
button, summary, select { cursor: pointer; }
a { color: var(--green); }
:focus-visible { outline: 3px solid var(--rust); outline-offset: 3px; }
main:focus:not(:focus-visible), [tabindex="-1"]:focus:not(:focus-visible) { outline: none; }
::selection { color: var(--ink); background: #cce3d5; }
.skip { position: fixed; top: .5rem; left: .5rem; z-index: 8; padding: .45rem 1rem; background: var(--sheet); transform: translateY(-180%); }
.skip:focus { transform: none; }
h1, h2, h3, p, ol, ul, dl, blockquote, figure { margin: 0; }
h1, h2, h3 { font-family: var(--serif); line-height: 1.35; }
h1 { font-size: clamp(1.85rem, 3.4vw, 3.2rem); font-weight: 650; }
h2 { font-size: clamp(1.4rem, 2.1vw, 2rem); }
h3 { font-size: 1.19rem; }
button:disabled { cursor: not-allowed; color: #555d55; background: #e7e8e0; border-color: #adb3a7; }
.mast { border-top: 4px solid var(--green); border-bottom: 1px solid var(--rule); }
.mast-inner, main, .colophon { width: min(calc(100% - 4rem), 72rem); margin-inline: auto; }
.mast-inner { min-height: 4.45rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand, .mast-tools, .actions, .meta-row, .tabbar, .section-head, .nav-head, .question-meta { display: flex; align-items: center; flex-wrap: wrap; gap: .55rem .8rem; }
.brand { flex-wrap: nowrap; gap: .75rem; }
.mark { flex: none; fill: none; }
.mark-page { fill: var(--green); }
.mark-stitch { stroke: var(--sheet); stroke-width: 1.35; stroke-linecap: round; }
.wordmark { font: 650 1.6rem/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.025em; font-variant-ligatures: none; }
.mast-sub { border-left: 1px solid var(--rule); padding-left: .85rem; color: var(--muted); font-size: .86rem; }
.mast-tools { justify-content: flex-end; }
.mast-state, .colophon, .helper, .empty, .micro, .counter { color: var(--muted); font-size: .87rem; }
main { flex: 1; min-width: 0; }
.colophon { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .3rem 1rem; padding: 1rem 0 1.35rem; margin-top: 2.7rem; border-top: 1px solid var(--rule); }
.colophon > :first-child { font-family: Georgia, serif; font-style: italic; }
.boot { margin: 3rem auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; max-width: 100%; min-height: 2.65rem; padding: .45rem .95rem; border: 1px solid var(--edge); border-radius: 4px; background: transparent; line-height: 1.35; font-weight: 560; text-align: center; overflow-wrap: anywhere; }
.btn:hover:not(:disabled) { border-color: var(--green); background: var(--green-wash); color: var(--green-dark); }
.btn.primary { background: var(--green); color: var(--sheet); border-color: var(--green); }
.btn.primary:hover:not(:disabled) { background: var(--green-dark); color: var(--sheet); }
.btn.warn { color: var(--rust); border-color: var(--rust); }
.btn.warn:hover:not(:disabled) { color: var(--rust); background: var(--rust-wash); border-color: var(--rust); }
.btn.small { min-height: 2.28rem; padding: .36rem .65rem; font-size: .86rem; }
.btn.text { border-color: transparent; background: transparent; color: var(--green); padding-inline: .22rem; text-decoration: underline; text-underline-offset: .27em; }
.btn.text:hover:not(:disabled) { background: transparent; }
.eyebrow, .folio { color: var(--green); font-size: .79rem; font-weight: 650; letter-spacing: .09em; }
.folio, .id { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.folio { white-space: nowrap; }
.welcome { max-width: 62rem; margin: clamp(2.2rem, 7vh, 4.8rem) auto 1.6rem; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(13rem, .82fr); align-items: start; gap: clamp(2rem, 6vw, 5.6rem); }
.welcome-main, .specimen, .workspace > *, .record, .section-head > *, .field { min-width: 0; }
.welcome h1 { margin: .45rem 0 .82rem; font-size: clamp(2.15rem, 4.3vw, 3.65rem); letter-spacing: -.045em; }
.lead { font-size: 1.02rem; max-width: 35rem; color: #424b42; line-height: 1.8; }
.start-form { margin: 1.8rem 0 .85rem; display: grid; gap: .6rem; }
.start-form .actions { margin-top: .35rem; }
.welcome .privacy { border-top: 1px solid var(--rule); margin-top: 1.55rem; padding-top: .8rem; }
.specimen { position: relative; margin-top: 1.05rem; border-top: 2px solid var(--rust); border-bottom: 1px solid var(--rule); padding: 1.2rem .12rem .9rem; }
.specimen .eyebrow { color: var(--rust); }
.specimen blockquote { font: 600 clamp(1.15rem, 1.8vw, 1.5rem)/1.58 var(--serif); margin: .6rem 0; }
.specimen .revision-mark { display: inline-flex; align-items: center; gap: .55rem; color: var(--rust); font-size: .8rem; }
.specimen .revision-mark::before { content: ""; width: 2rem; height: 1px; background: currentColor; }
.specimen .actions { margin-top: 1rem; }
.workspace { display: grid; grid-template-columns: minmax(12.5rem, 15rem) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3.6rem); margin: 2.2rem 0 0; align-items: start; }
.index { padding-right: 1.2rem; border-right: 1px solid var(--rule); }
.nav-head { justify-content: space-between; padding-bottom: .7rem; }
.index details > summary { font-family: var(--serif); font-weight: 650; font-size: 1.14rem; }
.index-list { display: grid; gap: .3rem; max-height: min(48vh, 30rem); overflow: auto; overscroll-behavior: contain; padding: .4rem .25rem .5rem; }
.nav-item { display: block; width: 100%; border: none; border-left: 3px solid transparent; border-radius: 0; background: transparent; padding: .5rem .65rem; color: var(--ink); text-align: start; line-height: 1.55; }
.nav-item:hover { background: #eeefe6; }
.nav-item[aria-current="page"] { color: var(--green-dark); background: var(--green-wash); border-left-color: var(--green); font-weight: 650; }
.nav-item .micro { display: block; font-weight: 450; font-size: .76rem; }
.index-foot { display: grid; justify-items: start; gap: .55rem; border-top: 1px solid var(--rule); margin-top: .75rem; padding-top: .75rem; }
.question-meta { justify-content: space-between; margin-bottom: .5rem; }
.question-head h1 { max-width: 24em; margin: .22rem 0 .75rem; }
.question-head > .actions { gap: .4rem .8rem; }
.history { margin-top: .55rem; }
.history ol { padding-left: 1.7rem; }
.history summary, .fold > summary { color: var(--green); padding: .45rem 0; font-weight: 550; }
.tabbar { gap: 0 .25rem; margin: 1.35rem 0 1.1rem; border-bottom: 1px solid var(--rule); }
.tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: .55rem .8rem; font-size: .98rem; color: var(--muted); background: transparent; }
.tab[aria-pressed="true"] { color: var(--green-dark); font-weight: 680; border-bottom-color: var(--green); }
.tab:hover { background: var(--green-wash); }
.section-head { justify-content: space-between; gap: .55rem 1rem; margin: .5rem 0 .8rem; }
.section-head h2 { font-size: 1.52rem; }
.group-title { margin: 1.35rem 0 .1rem; font-size: 1.15rem; }
.section-intro { color: var(--muted); margin: -.28rem 0 .8rem; font-size: .91rem; }
.note-list, .entry-list, .idea-list { display: grid; gap: .2rem; }
.record { padding: .86rem 0; border-bottom: 1px solid var(--rule); }
.record .entry-text, .body-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.entry-text { margin-top: .28rem; }
.record .source { margin-top: .25rem; }
.meta-row { gap: .36rem .6rem; }
.id { font-size: .8rem; color: var(--muted); }
.tag { display: inline-block; font: 600 .78rem/1.45 var(--sans); color: var(--green-dark); background: var(--green-wash); border: 1px solid #c6d6c8; border-radius: 3px; padding: .08rem .38rem; }
.tag.rust { color: var(--rust); background: var(--rust-wash); border-color: #dcbfb0; }
.tag.neutral { color: #4a5049; background: #eeeee6; border-color: var(--rule); }
.empty, .hint { padding: .65rem .8rem; border-left: 2px solid var(--rule); margin: .55rem 0; }
.hint { background: #eeefe6; font-size: .9rem; }
.sample-note { border-left-color: var(--rust); color: #673728; background: var(--rust-wash); margin: 0 0 1rem; }
.idea { border-bottom: 1px solid var(--rule); padding: 0; }
.idea > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .4rem .85rem; align-items: center; padding: .95rem .2rem; }
.idea > summary::-webkit-details-marker { display: none; }
.idea > summary::after { grid-column: 2; grid-row: 1 / 3; content: "+"; font: 1.35rem/1 var(--mono); color: var(--green); }
.idea[open] > summary::after { content: "−"; }
.idea > summary .idea-title { grid-column: 1; font: 650 1.22rem/1.55 var(--serif); white-space: pre-wrap; }
.idea-content { padding: .15rem .25rem 1.1rem .95rem; margin-left: .15rem; border-left: 2px solid var(--rule); }
.fact-list { margin: .6rem 0; display: grid; grid-template-columns: minmax(5rem, auto) minmax(0, 1fr); gap: .43rem .85rem; }
.fact-list dt { color: var(--muted); font-size: .87rem; }
.fact-list dd { margin: 0; white-space: pre-wrap; }
.idea-content h3 { margin: .8rem 0 .15rem; font-size: 1.05rem; }
.idea-content > .actions, .record > .actions { margin-top: .7rem; }
.citation { padding: .5rem .7rem; border-left: 2px solid var(--edge); margin: .5rem 0; }
.citation p { font-size: .94rem; }
.source, .muted { color: var(--muted); font-size: .86rem; }
.relation-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .55rem; }
.relation-line .btn { text-align: start; }
.notice:not(:empty) { width: min(calc(100% - 2rem), 72rem); margin: .55rem auto 0; padding: .4rem .7rem; color: var(--green-dark); border-left: 2px solid var(--green); background: var(--green-wash); font-size: .87rem; }
dialog { border: 1px solid var(--edge); border-radius: 6px; color: var(--ink); background: var(--sheet); padding: 0; max-height: calc(100dvh - 2rem); max-width: calc(100% - 2rem); }
dialog::backdrop { background: rgb(32 39 31 / .42); }
.sheet { width: 40rem; }
.guard { width: 29rem; padding: 1.3rem; }
.guard p { margin: .7rem 0 1rem; }
.dialog-head { position: sticky; z-index: 1; top: 0; background: var(--sheet); border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .8rem 1.2rem; }
.dialog-head h2, .guard h2 { font-size: 1.38rem; }
.dialog-body { padding: 1rem 1.2rem 1.15rem; }
.dialog-body > :first-child, .dialog-body > :first-child > :first-child { margin-top: 0; }
.dialog-body > .actions, .editor > .actions, .file-group > .actions, .fold .actions { margin-top: .85rem; }
.editor { display: grid; gap: .85rem; }
.field { display: grid; gap: .3rem; }
.field > label, .start-form > label, fieldset legend { font-size: .92rem; font-weight: 650; }
input:not([type="checkbox"]):not([type="file"]), textarea, select { width: 100%; min-width: 0; background: #fffefa; border: 1px solid var(--edge); border-radius: 4px; padding: .53rem .65rem; }
textarea { display: block; min-height: 3.1rem; resize: vertical; line-height: 1.55; }
textarea[readonly] { background: var(--paper); }
input::placeholder, textarea::placeholder { color: #697163; opacity: 1; }
.field-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
fieldset { min-width: 0; border: 1px solid var(--rule); padding: .6rem .7rem; margin: 0; }
.checkbox-list { display: grid; gap: .32rem; max-height: 13rem; overflow: auto; padding: .2rem; }
.check { display: flex; align-items: baseline; gap: .55rem; padding: .3rem .15rem; line-height: 1.55; }
.check input { flex: 0 0 auto; width: 1rem; height: 1rem; margin: 0; accent-color: var(--green); align-self: flex-start; margin-top: .2rem; }
.check:has(input:checked) { background: var(--green-wash); }
.field-note { font-size: .83rem; color: var(--muted); }
.error { margin: 0 1.2rem 1rem; padding: .65rem .8rem; background: var(--rust-wash); border-left: 3px solid var(--rust); color: var(--rust); }
.file-group + .file-group, .fold { margin-top: .9rem; border-top: 1px solid var(--rule); padding-top: .75rem; }
.file-group h3 { margin-bottom: .25rem; }
.preview { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 45vh; overflow: auto; padding: .7rem; background: var(--paper); font: .92rem/1.55 var(--sans); border: 1px solid var(--rule); }
.ai-block { display: grid; gap: .7rem; }
.ai-block h3 { font-size: 1.12rem; }
.ai-block .field { scroll-margin-block-start: 4.2rem; }
@media (max-width: 48rem) {
  .mast-inner, main, .colophon { width: min(calc(100% - 2rem), 43rem); }
  .mast-sub { display: none; }
  .welcome { gap: 1.8rem; grid-template-columns: minmax(0, 1fr) minmax(10rem, .7fr); margin-top: 2.4rem; }
  .workspace { grid-template-columns: minmax(0, 1fr); gap: 1.25rem; margin-top: .9rem; }
  .index { border-right: 0; padding: 0 0 .65rem; border-bottom: 1px solid var(--rule); }
  .index-foot { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; }
  .index-list { max-height: min(40dvh, 15rem); }
  .colophon { margin-top: 1.8rem; }
}
@media (max-width: 37rem) {
  .mast-inner { min-height: 3.9rem; gap: .35rem; }
  .brand { gap: .45rem; }
  .mark { width: 28px; height: 28px; }
  .wordmark { font-size: 1.32rem; }
  .mast-state { display: none; }
  .welcome { display: block; margin: 1.75rem auto 0; }
  .welcome h1 { font-size: 2.15rem; }
  .start-form { margin-top: 1.15rem; }
  .welcome .privacy { margin-top: .95rem; }
  .specimen { margin-top: 1.7rem; padding-top: .85rem; }
  .specimen blockquote { margin: .3rem 0; }
  .specimen .actions { margin-top: .6rem; }
  .tabbar { margin-top: 1rem; gap: 0; }
  .tab { font-size: .91rem; padding: .55rem .5rem; }
  .field-pair { grid-template-columns: minmax(0, 1fr); }
  .fact-list { grid-template-columns: minmax(0, 1fr); gap: .12rem; }
  .fact-list dd { margin-bottom: .45rem; }
  .dialog-head, .dialog-body { padding-inline: .85rem; }
  .error { margin-inline: .85rem; }

}
@media (max-height: 30rem) { .dialog-head { position: static; } .index-list { max-height: 38dvh; } }
@media (forced-colors: active) { .mark-page { fill: CanvasText; } .mark-stitch { stroke: Canvas; } .tab[aria-pressed="true"], .nav-item[aria-current="page"] { border-color: Highlight; } }
</style>

  <a class="skip" href="#main">跳到正文</a>
  <header class="mast">
    <div class="mast-inner">
      <div class="brand">
        <svg class="mark" width="35" height="35" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
          <path class="mark-page" d="M5 7h12l3 3h11v18H19l-3-3H5z" />
          <path class="mark-stitch" d="M7 12h7m-7 4h7m7-1h7m-7 4h7M17 7v17" />
        </svg>
        <span class="wordmark">flyfishPhilo</span>
        <span class="mast-sub">哲学手记工作台</span>
      </div>
      <div class="mast-tools">
        <span id="book-state" class="mast-state">仅在本页</span>
        <button id="file-menu" class="btn small" type="button" hidden>手记文件</button>
      </div>
    </div>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></div>
  <main id="main" tabindex="-1">
    <div id="desk"><p class="boot">正在打开工作台。</p></div>
    <noscript><p>这份离线工作台需要浏览器启用 JavaScript。启用后重新打开，不需要联网。</p></noscript>
  </main>
  <footer class="colophon"><span>flyfishPhilo</span><span>没有账户，不自动保存，也不发送手记。</span></footer>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <header class="dialog-head"><h2 id="sheet-title"></h2><button id="sheet-close" type="button" class="btn small">关闭</button></header>
    <div id="sheet-body" class="dialog-body"></div>
    <p id="sheet-error" class="error" role="alert" tabindex="-1" hidden></p>
  </dialog>
  <dialog id="guard" class="guard" aria-labelledby="guard-title" aria-describedby="guard-text">
    <h2 id="guard-title"></h2>
    <p id="guard-text"></p>
    <div id="guard-actions" class="actions"></div>
  </dialog>
  <template id="choice-control"><select></select></template>
  <script>/* The portable notebook. No filesystem, network, clock or model dependency. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.FlyfishPhilo = api;
})(globalThis, function () {
  'use strict';
  const FORMAT = 'flyfishPhilo/1';
  const LIMITS = Object.freeze({events:2000, bytes:2097152, text:6000, refs:32});
  // One small closing entry: up to 256 UTF-16 units, even if JSON escapes each
  // one as six bytes, plus room for pretty-printing, IDs and fixed fields.
  const CLOSING_BYTES=256*6+320;
  const ideaKeys='question kind text scope why rival test notes previous seed';
  const fields = {question:'text', reword:'question text', rest:'question', resume:'question',
    note:'question origin source text', seed:'question text', idea:ideaKeys, suggest:ideaKeys+' base',
    challenge:'idea note verdict detail', adopt:'idea review reason consent', withdraw:'idea reason consent',
    trial:'idea step', link:'from to relation why'};
  const oneOf=(x,list)=>need(list.includes(x),'没有这个类型或状态');
  function status(i) { return i.withdrawn?'withdrawn':i.checks.some(c=>c.verdict==='counter')?'challenged':i.adopted?'adopted':'candidate'; }
  function need(ok, message) { if (!ok) throw new Error(message); }
  function record(x) { return x !== null && typeof x === 'object' && !Array.isArray(x) && [Object.prototype,null].includes(Object.getPrototypeOf(x)); }
  function exact(x, names) {
    need(record(x) && Object.keys(x).length === names.length && names.every(k => Object.hasOwn(x,k)), '字段缺失或含有未定义的权限/字段');
  }
  function text(x) { need(typeof x === 'string' && x.trim() && x.length <= LIMITS.text, '请填写有效的文字（每项不超过 6000 个 UTF-16 单元）'); }
  function ref(map, id, what) { need(typeof id === 'string' && Object.hasOwn(map,id), `没有可引用的${what}：${String(id)}`); return map[id]; }
  function openQ(s, id) { const q = ref(s.questions,id,'问题'); need(!q.paused,'问题已悬置，请先重开'); return q; }
  const blank = () => ({format:FORMAT,events:[]});
  function step(s,e) {
    const {type,id} = e;
    switch (type) {
      case 'question': text(e.text); s.questions[id] = {id,text:e.text,wording:[e.text],paused:false}; break;
      case 'reword': { const q=openQ(s,e.question); text(e.text); need(e.text !== q.text,'措辞未改变'); q.text=e.text; q.wording.push(e.text); break; }
      case 'rest': openQ(s,e.question).paused=true; break;
      case 'resume': { const q=ref(s.questions,e.question,'问题'); need(q.paused,'问题尚未悬置'); q.paused=false; break; }
      case 'note': {
        if(e.question!==null) ref(s.questions,e.question,'问题');
        oneOf(e.origin,['firsthand','excerpt','retelling','synthetic','ai']); text(e.source); text(e.text);
        s.notes[id]={...e}; break;
      }
      case 'seed': openQ(s,e.question); text(e.text); s.seeds[id]={...e}; break;
      case 'idea': case 'suggest': {
        openQ(s,e.question); oneOf(e.kind,['reading','claim','practice']);
        [e.text,e.scope,e.why,e.rival,e.test].forEach(text);
        need(Array.isArray(e.notes) && e.notes.length>0 && e.notes.length<=LIMITS.refs && new Set(e.notes).size===e.notes.length,'请引用一至三十二个不同的材料');
        for(const n of e.notes) ref(s.notes,n,'材料'); // iteration sees sparse slots
        if(e.previous!==null) {
          const p=ref(s.ideas,e.previous,'前稿'); need(p.question===e.question && p.kind===e.kind,'修订须属同一问题和类型');
          const norm=t=>t.trim().replace(/\s+/g,' ');

    const names={firsthand:'亲历',excerpt:'摘录',retelling:'转述',synthetic:'虚构',ai:'AI 解释',reading:'解释',claim:'命题',practice:'实践',candidate:'候选',adopted:'当前采纳',challenged:'反例阻断',withdrawn:'已撤回',counter:'反例',limit:'限制适用域',open:'未决',survives:'本次检验未推翻',supports:'支持',tensions:'有张力',requires:'以前者所指向的区分为前提',distinguishes:'区分'};
    out('## 当前内核 · 我现在采用什么','');
    const active=items.filter(i=>status(i)==='adopted');
    for(const i of active) out(`- ${i.id}（${names[i.kind]}）${show(i.text)}；范围：${show(i.scope)}`);
    if(!active.length) out('尚无采纳。留空是合法结果。');
    out('','## 深层记忆 · 材料及出处','');
    for(const n of Object.values(s.notes)) out(`- ${n.id} · ${names[n.origin]} · ${show(n.source)}：${show(n.text)}`);
    out('','## 未坍缩区 · 问题与未成形的念头','');
    for(const q of issues){out(`- ${q.id}［${q.paused?'已悬置':'开放'}］${show(q.text)}`); if(q.wording.length>1) out(`  - 问法的变化：${q.wording.map(show).join(' → ')}`);}
    for(const seed of Object.values(s.seeds)) out(`- ${seed.id} → ${seed.question}：${show(seed.text)}`);
    out('','## 论证与修订 · 为什么改口','');
    for(const i of items){
      out(`### ${i.id} · ${names[i.kind]} · ${names[status(i)]}`,`${show(i.text)}`,'',`- 问题：${i.question}；材料：${i.notes.join('、')}；来源：${i.origin==='ai'?'AI 提案':'作者录入'}${i.previous?'；修订自 '+i.previous:''}${i.seed?'；源于念头 '+i.seed:''}`,`- 适用范围：${show(i.scope)}`,`- 理由：${show(i.why)}`,`- 竞争解释：${show(i.rival)}`,`- 怎样区分：${show(i.test)}`);
      for(const c of i.checks) out(`- 检验 ${c.id}（${names[c.verdict]}，材料 ${c.note}）：${show(c.detail)}`);
      if(i.approval) out(`- 采纳理由：${show(i.approval.reason)}；冲突审查：${show(i.approval.review)}`);
      if(i.withdrawal) out(`- 撤回：${show(i.withdrawal.reason)}`); out('');
    }
    for(const l of s.links) out(`- ${l.from} → ${l.to}（${names[l.relation]}）：${show(l.why)}`);
    out('','## 执行层 · 本人登记的试行','');
    if(!s.trials.length) out('没有试行。工作台不会执行外部操作。');
    for(const t of s.trials) out(`- ${t.id} → ${t.idea}：${show(t.step)}`);
    return rows.join('\n')+'\n';
  }
  return {FORMAT,LIMITS,blank,append,replay,status,markdown};
});

      busy = true; apply.disabled = true;
      try {
        let proposal; try { proposal = JSON.parse(raw); } catch (_) { throw Error('不是有效的 JSON。若对方只给了普通文字，请改用「手工保存 AI 文字」。'); }
        if (proposal && (proposal.format === 'flyfishPhilo/1' || Object.hasOwn(proposal,'events'))) throw Error('这是手记或事件集合，不是候选提案。这个入口不能恢复整本。');
        const next = await bridge.apply(original,proposal);
        if (!currentSession(epoch) || guard.open || book !== original || f.elements.proposal.value !== raw) return;
        const projected = core.replay(next), id = firstNew(projected.ideas,view.ideas), idea = projected.ideas[id];
        if (!idea || idea.origin !== 'ai' || core.status(idea) !== 'candidate') throw Error('没有得到可审阅的 AI 候选。');
        if (idea.question !== q.id) throw Error('提案属于另一个问题，请打开对应问题后再粘贴。');
        place(next,projected,'suggest',{}); notice('AI 提案已作为候选记入，未经本人采纳。');
      } catch (err) { if (currentSession(epoch) && book === original) fail('提案未写入，原手记保留。' + err.message); }
      finally { busy = false; apply.disabled = false; }
    });
    const apply = submitBtn('校验并记入候选');
    f.append(p('只粘贴对方返回的提案 JSON。请不要粘贴整本手记；校验失败不会改变当前内容。','helper'),
      field('proposal','AI 提案 JSON',{rows:8}),box('actions',apply,btn('取消',closeSheet)));
    epoch = openSheet('粘贴 AI 提案 JSON',f); f.elements.proposal.focus();
  }

  $('sheet-close').addEventListener('click', closeSheet);
  sheet.addEventListener('cancel', e => { e.preventDefault(); closeSheet(); });
  $('file-menu').addEventListener('click', () => fileSheet());
  try {
    book = core.blank(); view = core.replay(book); render();
  } catch (_) {
    desk.replaceChildren(el('h1','boot','无法打开工作台'),p('缺少可用的离线核心。请重新打开完整的 flyfishPhilo HTML 文件。'));
  }
})();
</script>
