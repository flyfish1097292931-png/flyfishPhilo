name: Portable workbench
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The runner is chosen only from the literal matrix above, not event text.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test
      - run: node tools/build.cjs --check
      - run: python -m unittest discover -s tests -p test_*.py
      - run: python tools/package.py --check
