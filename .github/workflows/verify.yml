name: Portable Agent integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: '3.9'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: macos-15, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    # The runner is chosen only from the literal matrix above, not event text.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: node --test
      - run: node tools/build.cjs --check
      - run: python -B -m unittest discover -s tests -p test_*.py
      - run: python tools/package.py --check
